version: "3.8"

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass_change_me}
      MYSQL_DATABASE: ${DB_NAME:-asm_system}
      MYSQL_USER: ${DB_USER:-asm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      TZ: Asia/Bangkok
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-asm_user}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_NAME: ${DB_NAME:-asm_system}
      JWT_SECRET: ${JWT_SECRET:-please_change_this_to_a_long_random_secret}
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}
      BACKUP_DIR: /app/backups
      FRONTEND_DIR: /frontend_public
      TZ: Asia/Bangkok
    volumes:
      - ./backend/backups:/app/backups
      - ./frontend/public:/frontend_public:ro
    ports:
      - "4000:4000"

volumes:
  db_data:
