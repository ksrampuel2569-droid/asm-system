<style>

let st=[],q='';
function sum(l){let u=0,ok=0,pok=0,pbad=0,np=0;l.forEach(x=>{const k=x.q||1,v=(x.p||0)*k;u+=k;if(x.p==null)np+=k;if(x.st==='ok'){ok+=k;pok+=v}else pbad+=v});return{u,ok,bad:u-ok,pok,pbad,np}}
function hud(l){const s=sum(l);return`<div class="hud"><span class="chip">📦 ทั้งหมด ${s.u} ชิ้น</span><span class="chip ok">✅ ใช้งานได้ ${s.ok} ชิ้น · ${money(s.pok)} บาท</span><span class="chip bad">⛔ ชำรุด/เสื่อมสภาพ/จำหน่าย ${s.bad} ชิ้น · ${money(s.pbad)} บาท</span>${s.np?`<span class="chip">ไม่ระบุราคา ${s.np} ชิ้น</span>`:''}${l.some(x=>x.fx)?`<button class="chip wchip" data-fl="1">❗ ต้องแก้เลขครุภัณฑ์ ${l.filter(x=>x.fx).length} รายการ</button>`:''}</div><div class="bar"><i style="width:${s.u?s.ok/s.u*100:0}%"></i></div>`}
function sel(c){return C.filter(x=>x.t===c.t&&(!c.r||x.r===c.r)&&(!c.g||x.g===c.g)&&(!c.ser||x.ser===c.ser))}
const KEY={cat:'r',grp:'g',ser:'ser'},NEXT={cat:'grp',grp:'ser',ser:'items'};
const lab=(k,v)=>k==='r'?v.replace('ครุภัณฑ์',''):(k==='ser'&&v!=='-'?v:(v==='-'?'ไม่มีเลขรหัสมาตรฐาน':v));
function open(k,c,p){const key=KEY[k];if(key){const o=uniq(sel(c).map(x=>x[key]));if(o.length===1)return open(NEXT[k],{...c,[key]:o[0]},p.concat(lab(key,o[0])))}st.push({k,c,p,f:'all'});draw()}
function serRows(v,l,o){
  const nm=m=>{const c={};m.forEach(x=>c[x.n]=(c[x.n]||0)+1);return Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0]};
  const rg=m=>{let lo=1e9,hi=0;m.forEach(x=>{const r=/\/(\d+)(?:-(\d+))?$/.exec(x.c||'');if(r){lo=Math.min(lo,+r[1]);hi=Math.max(hi,+(r[2]||r[1]))}});return hi?(lo===hi?'/'+lo:'/'+lo+'-'+hi):''};
  const T=sum(l);
  $('app').innerHTML=`<h2>${esc(v.p[v.p.length-1]||'')}: เลือกเลขรหัสครุภัณฑ์</h2><p class="sub">แต่ละแถวคือเลขรหัสครุภัณฑ์หนึ่งชุด เรียงตามเลขรหัส บอกจำนวนชิ้นและจำนวนที่ใช้งานได้ กดที่แถวเพื่อดูรูปและรายละเอียดรายชิ้น</p>${hud(l)}<div class="rows"><div class="row rh"><span>แถวที่</span><span></span><span>เลขรหัสครุภัณฑ์</span><span>รายการ</span><span style="text-align:center">มี (ชิ้น)</span><span style="text-align:center">ใช้งานได้ (ชิ้น)</span><span style="text-align:center">ชำรุด/จำหน่าย</span></div><div id="rw" style="display:contents"></div><div class="row tot"><span></span><span></span><span>รวม ${o.length} แถว</span><span></span><span class="num tt">${T.u}</span><span class="num ok">${T.ok}</span><span class="num bad">${T.bad}</span></div></div>`;
  $('rw').innerHTML=o.map((val,i)=>{const m=l.filter(x=>x.ser===val),s=sum(m),a=m[0];
    return`<button class="row" data-i="${i}"><span class="rn">${i+1}</span>${svg(a.i,s.ok?a.col:'#d62828')}<span class="rc">${val==='-'?'ไม่มีเลขรหัส':esc(val+rg(m))}${m.some(x=>x.fx)?`<span class="warn s" data-s="${esc(val)}" role="button" tabindex="0" title="มีหมายเหตุเลขครุภัณฑ์">!</span>`:''}</span><span class="nm2">${esc(nm(m))}${m.length>1&&uniq(m.map(x=>x.n)).length>1?` <span class="mut">(และรายการอื่นในเลขรหัสเดียวกัน)</span>`:''}</span><span class="num tt"><span class="lb">มี </span>${s.u}<span class="lb"> ชิ้น</span></span><span class="num ${s.ok?'ok':'bad'}"><span class="lb">ใช้งานได้ </span>${s.ok}<span class="lb"> ชิ้น</span></span><span class="num ${s.bad?'bad':'tt'}"><span class="lb">ชำรุด/จำหน่าย </span>${s.bad}<span class="lb"> ชิ้น</span></span></button>`}).join('');
  document.querySelectorAll('.row[data-i]').forEach(b=>b.onclick=()=>{const val=o[+b.dataset.i];open('items',{...v.c,ser:val},v.p.concat(lab('ser',val)))})}
function grpRows(v,l,o){
  const T=sum(l);
  $('app').innerHTML=`<h2>${esc(v.p[v.p.length-1]||'')}: เลือกกลุ่ม</h2><p class="sub">แต่ละแถวคือหนึ่งกลุ่ม บอกว่ามีกี่แบบ (เลขรหัสต่างกัน) รูปเล็กใต้ชื่อคือตัวอย่างแต่ละแบบ (กรอบเขียว = มีที่ใช้งานได้ กรอบแดง = ไม่มีที่ใช้งานได้) กดที่แถวเพื่อดูรายแบบ</p>${hud(l)}<div class="rows"><div class="row g rh"><span>แถวที่</span><span>กลุ่ม / รูปแต่ละแบบ</span><span style="text-align:center">ทั้งหมด (ชิ้น)</span><span style="text-align:center">กำลังใช้งาน (ชิ้น)</span><span style="text-align:center">ไม่ใช้งาน (ชิ้น)</span></div><div id="rw" style="display:contents"></div><div class="row g tot"><span></span><span>รวม ${o.length} กลุ่ม</span><span class="num tt">${T.u}</span><span class="num ok">${T.ok}</span><span class="num bad">${T.bad}</span></div></div>`;

+'<xf numFmtId="3" fontId="1" fillId="3" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1"/>'
+'<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>'
+'</cellXfs></styleSheet>';

function statusSheet(s,fy){
  const L=C.filter(x=>x.st===s).sort((a,b)=>dk(a)-dk(b));
  const H=['ลำดับ','วัน เดือน ปี','เลขรหัสครุภัณฑ์','ยี่ห้อ , ชนิด , แบบ ,ขนาด และ ลักษณะ','จำนวน','ราคา/หน่วย','รวม','วิธีการได้มา','เอกสาร','ใช้ประจำที่','ผลการตรวจสอบประจำปี','ประเภทครุภัณฑ์'];
  const rows=[[{v:TITLE(fy),s:5}],H.map(h=>({v:h,s:1}))];
  L.forEach((x,i)=>{const r=i+3,q=qn(x),has=x.p!=null;
    rows.push([{v:i+1,s:3},{v:fmtD(x.d),s:3},{v:x.c||'',s:2},{v:x.n,s:2},{v:q,s:3},{v:has?x.p:'',s:4},has?{v:x.p*q,s:4,f:`E${r}*F${r}`}:{v:'',s:4},{v:x.s||'',s:2},{v:x.doc||'',s:2},{v:x.loc||'',s:2},{v:x.sl||STN[x.st],s:3},{v:x.r||x.t,s:2}])});
  const last=L.length+2,tr=L.length?{f1:`SUM(E3:E${last})`,f2:`SUM(G3:G${last})`}:{};
  const E=()=>({v:'',s:6});
  rows.push([E(),E(),E(),{v:'รวม',s:6},{v:sumQ(L),s:9,f:tr.f1},E(),{v:sumV(L),s:7,f:tr.f2},E(),E(),E(),E(),E()]);
  return{name:STN[s],rows,w:[7,15,22,55,8,13,14,16,14,26,22,22],fr:2,h:{1:42,2:32},m:['A1:L1']};
}

function dashSheet(fy){
  const rows=[[{v:TITLE(fy),s:5}],[{v:'Dashboard สรุปภาพรวมทะเบียนทรัพย์สิน (จำนวนเป็นชิ้น มูลค่าเป็นบาท)',s:10}]];
  const H=['ประเภท','รายการ','ทั้งหมด (ชิ้น)','ใช้งานได้','ชำรุด','เสื่อมสภาพ','จำหน่าย','มูลค่ารวม (บาท)','มูลค่าที่ใช้งานได้ (บาท)'];
  rows.push(H.map(h=>({v:h,s:1})));
  const T=['ที่ดิน','สิ่งก่อสร้าง','ครุภัณฑ์'],keys=[];
  C.forEach(x=>{const k=x.t+'|'+(x.r||'-');if(!keys.includes(k))keys.push(k)});
  keys.sort((a,b)=>T.indexOf(a.split('|')[0])-T.indexOf(b.split('|')[0]));
  const first=rows.length+1;
  keys.forEach(k=>{const [t,r]=k.split('|'),L=C.filter(x=>x.t===t&&(x.r||'-')===r),n=s=>sumQ(L.filter(x=>x.st===s)),row=rows.length+1;
    rows.push([{v:t,s:2},{v:r,s:2},{v:sumQ(L),s:8,f:`SUM(D${row}:G${row})`},{v:n('ok'),s:8},{v:n('b'),s:8},{v:n('d'),s:8},{v:n('x'),s:8},{v:sumV(L),s:4},{v:sumV(L.filter(x=>x.st==='ok')),s:4}])});
  const last=rows.length,ok=C.filter(x=>x.st==='ok');
  const sf=c=>keys.length?`SUM(${c}${first}:${c}${last})`:undefined,n=s=>sumQ(C.filter(x=>x.st===s));
  rows.push([{v:'รวมทั้งหมด',s:6},{v:'',s:6},{v:sumQ(C),s:9,f:sf('C')},{v:n('ok'),s:9,f:sf('D')},{v:n('b'),s:9,f:sf('E')},{v:n('d'),s:9,f:sf('F')},{v:n('x'),s:9,f:sf('G')},{v:sumV(C),s:7,f:sf('H')},{v:sumV(ok),s:7,f:sf('I')}]);
  rows.push([]);
  rows.push([{v:'สรุปตามประเภทหลัก',s:10}]);
  rows.push(H.map(h=>({v:h,s:1})));
  T.forEach(t=>{const L=C.filter(x=>x.t===t),n=s=>sumQ(L.filter(x=>x.st===s));
    rows.push([{v:t,s:2},{v:'',s:2},{v:sumQ(L),s:8},{v:n('ok'),s:8},{v:n('b'),s:8},{v:n('d'),s:8},{v:n('x'),s:8},{v:sumV(L),s:4},{v:sumV(L.filter(x=>x.st==='ok')),s:4}])});
  return{name:'Dashboard',rows,w:[16,28,14,12,10,12,12,18,22],fr:3,h:{1:42,3:32},m:['A1:I1','A2:I2']};
}

function buildXlsx(sheets){
  const ct=`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="${NS}package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>`
   +sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')+'</Types>';
  const wb=`<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="${NS}spreadsheetml/2006/main" xmlns:r="${NS}officeDocument/2006/relationships"><sheets>`+sheets.map((s,i)=>`<sheet name="${xe(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets></workbook>';
  const wr=`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="${NS}package/2006/relationships">`+sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="${NS}officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+`<Relationship Id="rId${sheets.length+1}" Type="${NS}officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  return zipBlob([['[Content_Types].xml',ct],['_rels/.rels',`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="${NS}package/2006/relationships"><Relationship Id="rId1" Type="${NS}officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],['xl/workbook.xml',wb],['xl/_rels/workbook.xml.rels',wr],['xl/styles.xml',STYLES],...sheets.map((s,i)=>[`xl/worksheets/sheet${i+1}.xml`,shXml(s,i===0)])]);
}

const OPTS=[['ok','✅ ใช้งานได้'],['b','🔧 ชำรุด'],['d','⚠️ เสื่อมสภาพ'],['x','🗃️ จำหน่าย'],['dash','📊 Dashboard (สรุปภาพรวม)']];
function expDlg(){
  const m=$('modal'),cnt=k=>k==='dash'?'สรุปทุกประเภท':C.filter(x=>x.st===k).length+' รายการ';
  m.innerHTML=`<div class="mbox"><h2 style="font-size:22px">⬇ ส่งออก Excel</h2><p class="mut" style="margin:0 0 10px">เลือกส่วนที่ต้องการ เลือกได้หลายส่วน แต่ละส่วนจะเป็นแผ่นงาน (Sheet) แยกกันในไฟล์เดียว</p>`
  +`<div style="display:grid;gap:10px">`+OPTS.map(([k,t])=>`<label style="display:flex;gap:10px;align-items:center;font-size:17px;color:var(--ink);cursor:pointer"><input type="checkbox" class="xo" value="${k}" checked style="width:22px;height:22px"> ${t} <span class="mut" style="font-size:14px">(${cnt(k)})</span></label>`).join('')+`</div>`
  +`<div class="fm" style="margin-top:14px"><label class="w">ประจำปีงบประมาณ (พ.ศ.) ที่แสดงในหัวตาราง<input id="xfy" type="number" value="2569"></label></div>`
  +`<div class="acts"><button class="btn" id="xgo">⬇ ส่งออก</button><button class="btn alt" id="xall">เลือก/ไม่เลือกทั้งหมด</button><button class="btn alt" id="xcn">ยกเลิก</button></div></div>`;
  m.classList.add('on');
  const boxes=[...m.querySelectorAll('.xo')];
  $('xcn').onclick=()=>m.classList.remove('on');
  $('xall').onclick=()=>{const on=boxes.some(b=>!b.checked);boxes.forEach(b=>b.checked=on)};
  $('xgo').onclick=()=>{
    const sel=boxes.filter(b=>b.checked).map(b=>b.value);
    if(!sel.length){toast('กรุณาเลือกอย่างน้อย 1 ส่วน');return}
    const fy=+$('xfy').value||2569;
    const sheets=sel.map(k=>k==='dash'?dashSheet(fy):statusSheet(k,fy));
    const a=document.createElement('a');a.href=URL.createObjectURL(buildXlsx(sheets));
    a.download='สรุปสำรวจครุภัณฑ์_รพ.สต.บ้านอำปึล_ปีงบ'+fy+'_'+new Date().toISOString().slice(0,10)+'.xlsx';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    dirty=false;$('exp').textContent='⬇ ส่งออก Excel';m.classList.remove('on');toast('ส่งออก '+sheets.length+' แผ่นงานแล้ว');
  };
}
$('exp').onclick=expDlg;
})();

draw();
</script></body></html>
